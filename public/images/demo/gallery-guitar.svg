<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="600" height="680" role="img" aria-label="Demo studio detail of an electric guitar">
  <defs>
    <linearGradient id="guitarBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="45%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bgDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="680" fill="url(#bgDark)"/>
  <!-- Carved top electric guitar body -->
  <path d="M-40,180 C120,60 340,40 490,140 C610,220 640,460 540,620 L-40,680 Z" fill="url(#guitarBody)" stroke="#60a5fa" stroke-width="6"/>
  <path d="M10,230 C140,120 320,105 445,190 C540,255 565,445 480,585" fill="none" stroke="#93c5fd" stroke-width="3" opacity="0.45"/>

  <!-- Humbucker Pickups (angled) -->
  <g transform="translate(210, 250) rotate(-28)">
    <rect x="0" y="0" width="175" height="86" rx="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="6"/>
    <rect x="12" y="10" width="151" height="30" rx="4" fill="#1e293b"/>
    <rect x="12" y="46" width="151" height="30" rx="4" fill="#1e293b"/>
    <g fill="#cbd5e1">
      <circle cx="32" cy="25" r="6"/><circle cx="58" cy="25" r="6"/><circle cx="84" cy="25" r="6"/>
      <circle cx="110" cy="25" r="6"/><circle cx="136" cy="25" r="6"/>
      <circle cx="32" cy="61" r="6"/><circle cx="58" cy="61" r="6"/><circle cx="84" cy="61" r="6"/>
      <circle cx="110" cy="61" r="6"/><circle cx="136" cy="61" r="6"/>
    </g>

    <rect x="15" y="135" width="175" height="86" rx="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="6"/>
    <rect x="27" y="145" width="151" height="30" rx="4" fill="#1e293b"/>
    <rect x="27" y="181" width="151" height="30" rx="4" fill="#1e293b"/>
    <g fill="#cbd5e1">
      <circle cx="47" cy="160" r="6"/><circle cx="73" cy="160" r="6"/><circle cx="99" cy="160" r="6"/>
      <circle cx="125" cy="160" r="6"/><circle cx="151" cy="160" r="6"/>
      <circle cx="47" cy="196" r="6"/><circle cx="73" cy="196" r="6"/><circle cx="99" cy="196" r="6"/>
      <circle cx="125" cy="196" r="6"/><circle cx="151" cy="196" r="6"/>
    </g>
  </g>

  <!-- Guitar Strings -->
  <g stroke="#e2e8f0" stroke-width="2.5" opacity="0.85">
    <line x1="90" y1="0" x2="430" y2="680"/>
    <line x1="112" y1="0" x2="452" y2="680"/>
    <line x1="134" y1="0" x2="474" y2="680"/>
    <line x1="156" y1="0" x2="496" y2="680"/>
    <line x1="178" y1="0" x2="518" y2="680"/>
    <line x1="200" y1="0" x2="540" y2="680"/>
  </g>

  <!-- Tone & Volume Knobs -->
  <circle cx="265" cy="545" r="32" fill="#1e293b" stroke="#93c5fd" stroke-width="4"/>
  <circle cx="265" cy="545" r="18" fill="#0f172a"/>
  <circle cx="385" cy="505" r="32" fill="#1e293b" stroke="#93c5fd" stroke-width="4"/>
  <circle cx="385" cy="505" r="18" fill="#0f172a"/>
</svg>
