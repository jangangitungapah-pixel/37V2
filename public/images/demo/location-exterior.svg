<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Demo architectural exterior illustration">
  <defs>
    <linearGradient id="concreteLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5e5e5"/>
      <stop offset="100%" stop-color="#a3a3a3"/>
    </linearGradient>
    <linearGradient id="concreteMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#737373"/>
      <stop offset="100%" stop-color="#404040"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" fill="#171717"/>

  <!-- Brutalist architectural concrete planes matching the screenshot -->
  <polygon points="0,40 310,0 310,310 0,340" fill="url(#concreteLight)" stroke="#171717" stroke-width="4"/>
  <polygon points="310,0 470,95 470,320 310,310" fill="url(#concreteMid)" stroke="#171717" stroke-width="4"/>
  <polygon points="380,45 720,0 720,250 380,190" fill="url(#concreteLight)" stroke="#171717" stroke-width="4"/>
  <polygon points="380,190 720,250 720,420 380,420" fill="#262626"/>

  <!-- Geometric shadow cut -->
  <polygon points="0,220 310,165 310,310 0,340" fill="#525252" opacity="0.65"/>

  <!-- Perforated metal studio gate at bottom -->
  <rect x="95" y="295" width="490" height="125" fill="#171717" stroke="#525252" stroke-width="5"/>
  <g stroke="#737373" stroke-width="3">
    <line x1="255" y1="295" x2="255" y2="420"/>
    <line x1="415" y1="295" x2="415" y2="420"/>
    <line x1="95" y1="355" x2="585" y2="355"/>
  </g>
  <!-- Geometric gate pattern -->
  <g stroke="#a3a3a3" stroke-width="2" opacity="0.65">
    <line x1="95" y1="295" x2="255" y2="355"/><line x1="255" y1="295" x2="95" y2="355"/>
    <line x1="255" y1="295" x2="415" y2="355"/><line x1="415" y1="295" x2="255" y2="355"/>
    <line x1="415" y1="295" x2="585" y2="355"/><line x1="585" y1="295" x2="415" y2="355"/>
    <line x1="95" y1="355" x2="255" y2="420"/><line x1="255" y1="355" x2="95" y2="420"/>
    <line x1="255" y1="355" x2="415" y2="420"/><line x1="415" y1="355" x2="255" y2="420"/>
    <line x1="415" y1="355" x2="585" y2="420"/><line x1="585" y1="355" x2="415" y2="420"/>
  </g>
</svg>
