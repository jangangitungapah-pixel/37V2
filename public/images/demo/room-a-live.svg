<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-label="Demo illustration of Room A Live Room">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b1d11"/>
      <stop offset="50%" stop-color="#5a2b18"/>
      <stop offset="100%" stop-color="#1c110c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a160e"/>
      <stop offset="100%" stop-color="#140b07"/>
    </linearGradient>
    <linearGradient id="rug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c281c"/>
      <stop offset="50%" stop-color="#581b14"/>
      <stop offset="100%" stop-color="#3d130e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.88" cy="0.38" r="0.45">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ceilingGlow" cx="0.5" cy="0.15" r="0.5">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background studio walls & acoustic treatment -->
  <rect width="960" height="460" fill="url(#wall)"/>
  <rect y="440" width="960" height="240" fill="url(#floor)"/>
  <rect width="960" height="680" fill="url(#ceilingGlow)"/>

  <!-- Wood slat diffusers & acoustic panels -->
  <g fill="#7c3a1d" opacity="0.55">
    <rect x="60" y="40" width="160" height="260" rx="4"/>
    <rect x="250" y="30" width="170" height="280" rx="4"/>
    <rect x="730" y="40" width="160" height="260" rx="4"/>
  </g>
  <!-- Acoustic fabric curtains in center -->
  <rect x="445" y="25" width="255" height="310" fill="#2b1710"/>
  <g stroke="#3f2217" stroke-width="4" opacity="0.8">
    <line x1="465" y1="25" x2="465" y2="335"/>
    <line x1="490" y1="25" x2="490" y2="335"/>
    <line x1="515" y1="25" x2="515" y2="335"/>
    <line x1="540" y1="25" x2="540" y2="335"/>
    <line x1="565" y1="25" x2="565" y2="335"/>
    <line x1="590" y1="25" x2="590" y2="335"/>
    <line x1="615" y1="25" x2="615" y2="335"/>
    <line x1="640" y1="25" x2="640" y2="335"/>
    <line x1="665" y1="25" x2="665" y2="335"/>
  </g>

  <!-- Crimson acoustic absorber panels -->
  <rect x="275" y="65" width="120" height="175" rx="3" fill="#6b1d1b" stroke="#230d0a" stroke-width="4"/>
  <rect x="750" y="70" width="120" height="175" rx="3" fill="#6b1d1b" stroke="#230d0a" stroke-width="4"/>

  <!-- Warm Persian studio carpet -->
  <polygon points="180,475 760,475 860,665 80,665" fill="url(#rug)" stroke="#9a3412" stroke-width="4"/>
  <polygon points="215,495 725,495 805,645 135,645" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="10 6" opacity="0.65"/>

  <!-- Outboard gear rack on left -->
  <g transform="translate(150, 215)">
    <rect x="0" y="0" width="115" height="250" fill="#171717" stroke="#0a0a0a" stroke-width="4"/>
    <rect x="10" y="14" width="95" height="28" fill="#262626" stroke="#404040"/>
    <circle cx="24" cy="28" r="5" fill="#c8f13a"/>
    <circle cx="42" cy="28" r="5" fill="#f59e0b"/>
    <rect x="60" y="22" width="34" height="12" fill="#0ea5e9" opacity="0.8"/>
    <rect x="10" y="50" width="95" height="32" fill="#1f2937" stroke="#374151"/>
    <rect x="18" y="60" width="50" height="10" fill="#fb923c"/>
    <rect x="10" y="90" width="95" height="36" fill="#27272a" stroke="#3f3f46"/>
    <rect x="10" y="134" width="95" height="45" fill="#18181b" stroke="#3f3f46"/>
    <rect x="10" y="188" width="95" height="50" fill="#09090b"/>
  </g>

  <!-- Guitars on rack (bottom left) -->
  <g transform="translate(20, 250)">
    <path d="M35,195 C12,185 8,145 28,125 C40,112 45,95 48,20 L62,20 C64,95 72,112 84,125 C102,145 98,185 75,195 Z" fill="#d97706" stroke="#151515" stroke-width="4"/>
    <circle cx="55" cy="148" r="14" fill="#151515"/>
    <path d="M85,210 C62,200 58,160 78,140 C90,127 95,110 98,35 L110,35 C112,110 120,127 132,140 C150,160 146,200 123,210 Z" fill="#b45309" stroke="#151515" stroke-width="4"/>
  </g>

  <!-- Production desk & DAW monitor -->
  <g transform="translate(330, 235)">
    <!-- Studio monitors -->
    <rect x="25" y="38" width="44" height="64" rx="4" fill="#171717" stroke="#0a0a0a" stroke-width="3"/>
    <circle cx="47" cy="56" r="7" fill="#52525b"/>
    <circle cx="47" cy="82" r="13" fill="#eab308" opacity="0.85"/>

    <rect x="275" y="38" width="44" height="64" rx="4" fill="#171717" stroke="#0a0a0a" stroke-width="3"/>
    <circle cx="297" cy="56" r="7" fill="#52525b"/>
    <circle cx="297" cy="82" r="13" fill="#eab308" opacity="0.85"/>

    <!-- Main DAW display -->
    <rect x="102" y="15" width="140" height="88" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="5"/>
    <rect x="108" y="21" width="128" height="76" fill="url(#screen)"/>
    <!-- DAW tracks waveform graphic -->
    <g fill="#c8f13a" opacity="0.9">
      <rect x="116" y="30" width="75" height="6" rx="2"/>
      <rect x="116" y="42" width="95" height="6" rx="2" fill="#38bdf8"/>
      <rect x="116" y="54" width="60" height="6" rx="2" fill="#fb923c"/>
      <rect x="116" y="66" width="104" height="6" rx="2" fill="#f43f5e"/>
      <rect x="116" y="78" width="84" height="6" rx="2" fill="#a855f7"/>
    </g>
    <rect x="162" y="103" width="20" height="18" fill="#334155"/>

    <!-- Desk surface -->
    <polygon points="0,120 345,120 370,142 -25,142" fill="#78350f" stroke="#1c1917" stroke-width="3"/>
    <rect x="12" y="142" width="14" height="125" fill="#1c1917"/>
    <rect x="318" y="142" width="14" height="125" fill="#1c1917"/>

    <!-- Studio chair silhouette -->
    <rect x="128" y="110" width="88" height="95" rx="14" fill="#18181b" stroke="#27272a" stroke-width="3"/>
    <rect x="166" y="205" width="12" height="55" fill="#27272a"/>
    <line x1="130" y1="260" x2="214" y2="260" stroke="#27272a" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Right side keyboard / synthesizer workstation -->
  <g transform="translate(715, 290)">
    <!-- Warm studio lamp -->
    <rect x="135" y="-65" width="75" height="55" rx="4" fill="#fef3c7" stroke="#78350f" stroke-width="3"/>
    <line x1="172" y1="-10" x2="172" y2="65" stroke="#78350f" stroke-width="6"/>

    <!-- Top synth tier -->
    <polygon points="25,45 195,45 215,95 5,95" fill="#1f2937" stroke="#09090b" stroke-width="4"/>
    <polygon points="35,62 188,62 202,90 18,90" fill="#f8fafc"/>

    <!-- Main 88-key stage piano tier -->
    <polygon points="0,125 215,125 235,235 -25,235" fill="#18181b" stroke="#09090b" stroke-width="4"/>
    <polygon points="15,148 205,148 222,225 -5,225" fill="#f1eee4" stroke="#151515" stroke-width="2"/>
    <!-- Black keys -->
    <g fill="#151515">
      <rect x="28" y="150" width="9" height="44"/>
      <rect x="44" y="150" width="9" height="44"/>
      <rect x="72" y="150" width="9" height="44"/>
      <rect x="88" y="150" width="9" height="44"/>
      <rect x="104" y="150" width="9" height="44"/>
      <rect x="132" y="150" width="9" height="44"/>
      <rect x="148" y="150" width="9" height="44"/>
      <rect x="176" y="150" width="9" height="44"/>
    </g>
  </g>

  <!-- Warm ambient lamp overlay -->
  <rect width="960" height="680" fill="url(#lampGlow)"/>
</svg>
